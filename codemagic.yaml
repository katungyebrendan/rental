workflows:
  homeset-ios:
    name: HomeSet iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: HomeSET

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rental.kats

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Apply uploaded iOS signing profile
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
