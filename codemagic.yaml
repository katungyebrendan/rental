workflows:
  homeset-ios:
    name: HomeSet iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: HomeSET

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rental.kats

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Install iOS CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
          diff Podfile.lock Pods/Manifest.lock
      - name: Apply uploaded iOS signing profile
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: flutter build ipa --release --export-options-plist="$HOME/export_options.plist"
      - name: Verify generated IPA
        script: |
          echo "Generated iOS archives and IPA files:"
          find build/ios -type f \( -name '*.ipa' -o -name '*.xcarchive' \) -print
          IPA_PATH="$(find build/ios -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "Error: flutter build ipa completed without producing an IPA file."
            exit 1
          fi
          echo "IPA ready for publishing: $IPA_PATH"

    artifacts:
      - build/ios/**/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
